apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blockchain-release-watcher.fullname" . }}
  labels:
    {{- include "blockchain-release-watcher.labels" . | nindent 4 }}
data:
  FLASK_HOST: {{ .Values.config.flaskHost | quote }}
  FLASK_PORT: {{ .Values.config.flaskPort | quote }}
  DATABASE_PATH: {{ .Values.config.databasePath | quote }}
  CHECK_INTERVAL_MINUTES: {{ .Values.config.checkIntervalMinutes | quote }}
  MONITORED_REPOS: {{ .Values.config.monitoredRepos | quote }}
  REPO_TAG_FILTERS: {{ .Values.config.repoTagFilters | quote }}
  GITLAB_API_BASE: {{ .Values.config.gitlabApiBase | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  EMAIL_ALERTS_ENABLED: {{ .Values.config.emailAlertsEnabled | quote }}
  SLACK_ALERTS_ENABLED: {{ .Values.config.slackAlertsEnabled | quote }}
  JIRA_BASE_URL: {{ .Values.config.jiraBaseUrl | quote }}
  JIRA_PROJECT_KEY: {{ .Values.config.jiraProjectKey | quote }}
  JIRA_ISSUE_TYPE: {{ .Values.config.jiraIssueType | quote }}
  JIRA_ALERTS_ENABLED: {{ .Values.config.jiraAlertsEnabled | quote }}
  AUTH_REQUIRED: {{ .Values.config.authRequired | quote }}
